name: NeoForge experimental build
on:
  push:
    branches: ["develop/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Build NeoForge mod
        run: gradle build --no-daemon --stacktrace
      - name: Upload prototype JAR (only after a successful build)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zonezero-mech-combat-experimental
          path: build/libs/*.jar
          if-no-files-found: error
